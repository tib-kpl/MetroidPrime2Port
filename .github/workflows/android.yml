name: android

# Every push to the port branch builds the release APK and publishes it on the
# "latest" release (https://github.com/tib-kpl/MetroidPrime2Port/releases/tag/latest),
# replacing the previous one. Can also be started by hand (Actions tab, or
# `gh workflow run android -r port`).
on:
  push:
    branches: [port]
  workflow_dispatch:

# Only the newest run per branch matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# contents: write is for the "latest" tag and release, nothing else.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.7"
      # The runner's own NDK is older than the r29 app/build.gradle pins, and
      # ANDROID_NDK_HOME (preset by the image) wins over the pin in
      # tools/android_apk.sh, so it is pointed at the pinned one.
      - name: SDK, NDK and Rust target
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;3.31.5" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android
      # Signed with the project's own key, so the APK installs over a release
      # without an uninstall (which would delete the save).
      - name: Build
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MP_APK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MP_APK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MP_APK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export MP_APK_KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$MP_APK_KEYSTORE"
          bash tools/android_apk.sh --strict-signing :app:assembleRelease
          rm -f "$MP_APK_KEYSTORE"
      # A different signer would make Android treat the APK as another app.
      - name: Check the signer
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          digest=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "signer: $digest"
          test "$digest" = 180e4c80415ffc0cff8e9e1d349a5d671e3c6d5ba600113019866ee58b1cf707
          version=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android/app/build.gradle)
          code=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' android/app/build.gradle)
          test -n "$version" && test -n "$code"
          echo "APK_VERSION=$version" >> "$GITHUB_ENV"
          echo "APK_BUILD=$code" >> "$GITHUB_ENV"
          mkdir dist
          cp "$apk" "dist/metroid-prime2-port-$version-build$code-${GITHUB_SHA::9}.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error
      # One rolling release: deleted and recreated each time, so the tag follows the commit and the
      # previous APK goes. GitHub makes the tag itself (a git push of it would need the workflows scope).
      - name: Publish on the latest release
        if: github.event_name == 'push' || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Version $APK_VERSION, build $APK_BUILD (versionCode), commit ${GITHUB_SHA::9}: $(git log -1 --format=%s)"
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/*.apk --target "$GITHUB_SHA" --title "v$APK_VERSION (build $APK_BUILD) - ${GITHUB_SHA::9}" --notes "$notes" --latest
